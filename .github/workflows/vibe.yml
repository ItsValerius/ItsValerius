name: Update vibe
on:
  schedule: [{ cron: '0 7 * * *' }] # once a day, so it reflects last night, not right now
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vibe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 } # amend needs HEAD's parent; depth 1 would turn the amend into a history-wiping root commit
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/vibe.mjs
        env:
          WHOOP_CLIENT_ID: ${{ secrets.WHOOP_CLIENT_ID }}
          WHOOP_CLIENT_SECRET: ${{ secrets.WHOOP_CLIENT_SECRET }}
          WHOOP_REFRESH_TOKEN: ${{ secrets.WHOOP_REFRESH_TOKEN }}
          NEW_TOKEN_FILE: ${{ runner.temp }}/rt
      # always(): the old token is already dead once refreshed, so save the new one even if a later API call failed
      - name: Save rotated refresh token
        if: always()
        run: '[ ! -s "$RUNNER_TEMP/rt" ] || gh secret set WHOOP_REFRESH_TOKEN -R "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/rt"'
        env:
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet && exit 0
          # Replace the previous vibe commit instead of stacking a new one, so past lines don't pile up in history
          if [ "$(git log -1 --format='%an|%s')" = "github-actions[bot]|vibe update" ]; then
            git commit -a --amend --no-edit && git push --force-with-lease
          else
            git commit -am "vibe update" && git push
          fi
