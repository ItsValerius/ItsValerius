name: Update vibe
on:
  schedule: [{ cron: '7 8 * * *' }]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vibe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 2 } # --amend needs HEAD's parent; at depth 1 it would create a new root commit
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: node scripts/vibe.mjs
        env:
          WHOOP_CLIENT_ID: ${{ secrets.WHOOP_CLIENT_ID }}
          WHOOP_CLIENT_SECRET: ${{ secrets.WHOOP_CLIENT_SECRET }}
          WHOOP_REFRESH_TOKEN: ${{ secrets.WHOOP_REFRESH_TOKEN }}
          NEW_TOKEN_FILE: ${{ runner.temp }}/rt
          GITHUB_TOKEN: ${{ github.token }}
      # Runs even if the update failed: the old refresh token is invalid once used
      - name: Save rotated refresh token
        if: always()
        run: '[ ! -s "$RUNNER_TEMP/rt" ] || gh secret set WHOOP_REFRESH_TOKEN -R "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/rt"'
        env:
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          # Amend the previous bot commit so history keeps only the latest card
          if [ "$(git log -1 --format='%an|%s')" = "github-actions[bot]|vibe update" ]; then
            git commit --amend --no-edit && git push --force-with-lease
          else
            git commit -m "vibe update" && git push
          fi
